name: Verify public site
on: workflow_dispatch
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare anonymous public resources with reviewed files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import sys
          import urllib.error
          import urllib.request

          base = "https://global-lean-club.vercel.app/"
          expected = {
              "index.html": "ade455ca1837cba6a927407072b689e83b666f2afe7e93ea24e895ca308c77dd",
              "app.js": "1247ac3e2f3947758cde713a2ccf9a164fe1680df8954d1cc8629b0ace03f697",
              "content.js": "2fe3968d5dff4f48d55b9e3be0ee9aef66ecca7317c9f1c25324449562f3b2a0",
              "styles.css": "6fba667fbff9f1cf6cef4a1f2b7878139407646e8c133a66848f19cab0ab0063",
              "assets/campus.png": "c0725175f855bbe8200ca8ef714abb645e04209900a7972fea218ee2abdd1781",
              "assets/workshop.png": "222b7271b56484e80c7abe49143e437819a5625a16b5b3b30d3d960de3591902",
              "assets/community.png": "a767946d1d24250d70cbb67dc5349c11b00afe47cf046ce862224b326a05bdd4",
              "assets/favicon.svg": "0cc3d7dc9281a2e17d6896f5de14837e9527848df99489b36dc3da1e646fc2c5",
          }
          passed = True
          for path, digest in expected.items():
              status, match = "ERROR", False
              try:
                  with urllib.request.urlopen(base + path, timeout=25) as response:
                      status = response.status
                      match = status == 200 and hashlib.sha256(response.read()).hexdigest() == digest
              except urllib.error.HTTPError as error:
                  status = error.code
              except Exception:
                  pass
              print(f"{path}: HTTP={status} SHA256={'MATCH' if match else 'FAIL'}")
              passed = passed and match
          print(f"Overall: {'PASS' if passed else 'FAIL'}")
          sys.exit(0 if passed else 1)
          PY
